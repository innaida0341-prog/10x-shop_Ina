<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="10X Shop — a fast, resilient storefront built with React 19, TypeScript and Tailwind CSS v4. Browse gear, filter instantly, check out and track every order."
    />
    <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080a12" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <title>10X Shop — Gear that keeps up</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://10x-shop-ina.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="10X Shop" />
    <meta property="og:title" content="10X Shop — Gear that keeps up" />
    <meta
      property="og:description"
      content="A resilient storefront: instant filtering, a persistent cart, local checkout and live order tracking."
    />
    <meta property="og:url" content="https://10x-shop-ina.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://dummyjson.com" />
    <link rel="dns-prefetch" href="https://dummyjson.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("shop_theme");
          var theme =
            stored === '"dark"' || stored === '"light"'
              ? JSON.parse(stored)
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          margin: 3rem auto;
          max-width: 34rem;
          padding: 1.5rem;
          border: 1px solid #e5e0d8;
          border-radius: 1.15rem;
          background: #ffffff;
          color: #11131b;
          font-family: ui-sans-serif, system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <strong style="display: block; margin-bottom: 0.5rem; font-size: 1.125rem">
          JavaScript is required
        </strong>
        10X Shop is a single-page application. Enable JavaScript to browse the catalog,
        manage your cart and place orders.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
