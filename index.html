<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="10X Shop — a fast, resilient storefront built with React 19, TypeScript and Tailwind CSS v4." />
    <meta name="theme-color" content="#6d5ef6" />
    <title>10X Shop — Gear that keeps up</title>
    <link rel="preconnect" href="https://dummyjson.com" />
    <link rel="dns-prefetch" href="https://dummyjson.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"
    media="print"
    onload="this.media='all'" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("shop_theme");
          var theme = stored === '"dark"' || stored === '"light"'
            ? JSON.parse(stored)
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) { document.documentElement.dataset.theme = "light"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
